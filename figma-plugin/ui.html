<!-- ui.html — Figma plugin iframe. Holds the WebSocket client to the AE bridge. -->
<!-- Only the UI iframe can do network; the main thread (code.js) exports SVG and posts it here. -->
<!-- Plain HTML; no Tailwind or component library. Use the existing :root tokens and dark theme. -->
<!-- MCP is a secondary status line. Reuse .status/.dot, existing text colors and 8px gaps;
     importing remains the main workflow into AE. No extra setup controls in the normal flow. -->
<!-- Refactoring UI constraints (§2.1, §2.8, §3.6): the two adjacent actions are both panels.
     The send panel holds the image folder row and the 发送到 After Effects button; the composition
     panel holds three labelled columns (duration, frame rate, target project version) and the
     导出为 AEP 工程 button at its bottom. Both actions share the accent fill so they read alike,
     and each panel keeps its settings and its action together. The composition panel has no visible
     heading or hint line; each control keeps its own 11px caption. Layer tools are open beneath the
     panels; common settings follow, with advanced settings collapsed. Keep the existing dark tokens,
     8px control gaps/radii, 12px panel padding and 16px section spacing.
     Image and coordinate markers use paired secondary buttons with the existing --surface fill and --line edge.
     Node export and mask conversion are standard behavior, not redundant visible switches. -->
<style>
  :root { --bg:#1e1e1e; --panel:#2a2a2a; --surface:#383838; --surface-hover:#464646; --surface-active:#303030; --line:#4b4b4b; --line-hover:#5a5a5a; --accent:#a78bfa; --text:#e8e8e8; --muted:#a3a3a3; --ok:#22c55e; --err:#ef4444; }
  html,body { margin:0; font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Roboto,sans-serif; background:var(--bg); color:var(--text); color-scheme:dark; scrollbar-width:thin; }
  .wrap { padding:14px; box-sizing:border-box; max-width:480px; margin:0 auto; }
  .status { display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--err); }
  button { width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#1a1a1a;
           font-weight:600; cursor:pointer; }
  button:disabled,select:disabled { opacity:.4; cursor:not-allowed; }
  /* The export action shares the send button's accent fill; only its spacing from the
     composition fields is local. */
  .aep-export { margin-top:8px; }
  /* The send block is a panel too: its path field and folder picker sit on a --panel surface,
     so they take the --bg fill and a raised --surface edge instead of the panel fill they used
     on the bare page. */
  .send-settings { margin-top:0; }
  .image-folder { margin-bottom:0; }
  .image-folder-label { margin-bottom:4px; color:var(--text); }
  .image-folder-row { display:flex; align-items:flex-start; gap:8px; }
  .image-folder-path { flex:1; min-width:0; min-height:36px; padding:10px; box-sizing:border-box; border-radius:8px; background:var(--bg); overflow-wrap:anywhere; white-space:normal; user-select:text; }
  /* The icon is the button's only content: centre it in the 36px square instead of relying on
     the form control's text layout, which leaves block SVG content off-centre. */
  .image-folder-choose { flex:0 0 36px; width:36px; height:36px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--line); background:var(--surface); color:var(--text); }
  .image-folder-choose:hover:not(:disabled) { background:var(--surface-hover); border-color:var(--line-hover); }
  .image-folder-choose:active:not(:disabled) { background:var(--surface-active); }
  .image-folder-choose svg { display:block; width:20px; height:20px; }
  .image-folder-choose:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #ship { margin-top:8px; }
  .mark-actions { display:flex; gap:8px; margin-top:12px; }
  .mark-actions button { flex:1; min-width:0; }
  details { margin-top:12px; border-radius:8px; background:var(--panel); padding:12px; }
  summary { cursor:pointer; font-weight:600; }
  .tool-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  /* Layer tools sit on a panel surface, so their buttons need a raised fill and a hairline
     edge; panel-colored buttons read as plain text against the panel. */
  .layer-tools button { padding:9px 10px; border:1px solid var(--line); background:var(--surface); color:var(--text); }
  .layer-tools button:hover:not(:disabled) { background:var(--surface-hover); border-color:var(--line-hover); }
  .layer-tools button:active:not(:disabled) { background:var(--surface-active); }
  .layer-tools button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mark-hint { margin-top:8px; font-size:11px; line-height:1.5; color:var(--muted); }
  .msg { margin-top:10px; min-height:16px; color:var(--muted); overflow-wrap:anywhere; }
  .msg:empty { display:none; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .locate-layer,.open-folder { width:auto; margin-top:8px; padding:8px 10px; background:var(--panel); color:var(--text); }
  .locate-layer:focus-visible,.open-folder:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .settings { margin:16px 0 0; padding:12px; border:0; min-width:0; border-radius:8px; background:var(--panel); }
  .settings legend { padding:0 4px; font-weight:600; }
  .option { display:flex; align-items:center; gap:8px; min-height:28px; cursor:pointer; }
  .option input { flex:0 0 auto; margin:0; accent-color:var(--accent); }
  .option-stack { align-items:flex-start; padding:4px 0; }
  .option-stack + .option-stack { margin-top:8px; }
  .option-stack input { margin-top:2px; }
  .option-stack small { display:block; margin-top:4px; font-size:11px; line-height:1.5; color:var(--muted); }
  .option-spaced { margin-top:8px; }
  /* Description under a standalone option: left-aligned like the group hint above it,
     not indented under the checkbox label. */
  .option-hint { margin-top:4px; font-size:11px; line-height:1.5; color:var(--muted); }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:36px; }
  .setting-row + .setting-row { margin-top:8px; }
  .setting-row select { min-width:88px; max-width:65%; min-height:36px; padding:8px; border:0; border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  /* Composition settings sit directly under the export button: three equal columns, each with an
     11px caption above its control, so duration, frame rate and AEP version read as one group. */
  .comp-settings { margin-top:8px; }
  .comp-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .comp-field { min-width:0; }
  .comp-field label { display:block; margin-bottom:4px; color:var(--muted); font-size:11px; line-height:1.4; }
  .comp-field select { box-sizing:border-box; width:100%; min-width:0; min-height:36px; padding:8px; border:0; border-radius:8px; background:var(--bg); color:var(--text); font:inherit; cursor:pointer; }
  /* A focused select used to draw the accent ring around its rounded box and read as a selected
     control; dropdowns now show focus only through their own open state. */
  select:focus,select:focus-visible { outline:none; }
  input:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .advanced-group { margin-top:16px; }
  .advanced-label { margin:0 0 4px; color:var(--muted); font-size:11px; }
  .hint { margin-top:8px; font-size:11px; color:var(--muted); }
</style>

    </div>

<script>
  var PORT = 7365;
  var workspacePlugin = false, aepPort = 7366;
  var ws = null, connected = false, selCount = 0, imgAsm = null, exporting = false, blendNotice = '';
  var frameSelected = false;
  var aepMode = false, aepBusy = false, aepPacket = null, aepResultId = null, openingFolder = false;
  var imageFolder = '', folderBusy = false;
  var errorNodeId = null, locatingLayer = false;
  var imageTasks = Promise.resolve(), processingImages = false, imageProcessingFailed = false;
  var $ = function (id) { return document.getElementById(id); };
  var toolButtons = { 'detach-instances': 'detach', 'convert-groups': 'group-to-frame', 'expand-groups': 'expand', 'delete-hidden': 'delete-hidden' };
  var mcpSocket = null, mcpRetryTimer = null, mcpExecuting = false, mcpAepParts = false;
  var agentAep = null;
  function mcpStatus(on, text) {
    $('mcp-dot').className = 'dot ' + (on ? 'on' : 'off');
    $('mcp-status').textContent = text;
  }
  function mcpSend(message) {
    if (mcpSocket && mcpSocket.readyState === 1) mcpSocket.send(JSON.stringify(message));
  }
  function connectMcp() {
    mcpSocket = new WebSocket('ws://127.0.0.1:7367/plugin');
    mcpSocket.onopen = function () { parent.postMessage({pluginMessage:{type:'mcp-info'}}, '*'); };
    mcpSocket.onmessage = function (event) {
      var message = JSON.parse(event.data);
      if (message.type === 'ready') {
        mcpAepParts = !!message.aepParts;
        mcpStatus(true, 'MCP 已就绪'); return;
      }
      if (message.type !== 'command') return;
      if (message.command === 'f2a_export_aep' && !beginAgentAep(message)) return;
      parent.postMessage({pluginMessage:{type:'mcp-command', id:message.id, command:message.command, params:message.params}}, '*');
    };
    mcpSocket.onerror = function () { mcpStatus(false, 'MCP 等待 agent 连接'); };
    mcpSocket.onclose = function () {
      mcpStatus(false, 'MCP 等待 agent 连接');
      if (!mcpRetryTimer) mcpRetryTimer = setTimeout(function () { mcpRetryTimer = null; connectMcp(); }, 1500);
    };
  }
  var CHECKBOX_SETTINGS = [
    'organize', 'enableclip', 'ignorehidden', 'preserve-image-filters',
    'raster-effects', 'raster-paints', 'raster-image-crops', 'raster-masks', 'raster-booleans',
    'mergeblends', 'rasterallgroups', 'rasterinstances'
  ];
  var SELECT_SETTINGS = [
    'aep-version', 'aep-duration', 'aep-fps', 'text-mode', 'native-image-masks', 'raster-scale'
  ];
  var dirtySettings = {};
  function selectedNumber(id, fallback) {
    var el = $(id), value = el ? Number(el.value) : NaN;
    return isFinite(value) && value > 0 ? value : fallback;
  }
  function updateTextModeHint() {
    var hints = {editable:'细描边文字自动转为矢量。',vector:'无需本机字体，文字内容不可编辑。',png:'文字转为图片，内容不可编辑。'};
    var el = $('text-mode'), hint = el && hints[el.value];
    if (hint) $('text-mode-hint').textContent = hint;
  }
  function hasOption(select, value) {
    if (!select || !select.options) return true;
    for (var i = 0; i < select.options.length; i++) {
      if (select.options[i].value === value) return true;
    }
    return false;
  }
  function collectPanelSettings() {
    var data = {}, i, id, el;
    for (i = 0; i < CHECKBOX_SETTINGS.length; i++) {
      id = CHECKBOX_SETTINGS[i]; el = $(id);
      if (el) data[id] = !!el.checked;
    }
    for (i = 0; i < SELECT_SETTINGS.length; i++) {
      id = SELECT_SETTINGS[i]; el = $(id);
      if (el && el.value != null) data[id] = String(el.value);
    }
    return data;
  }
  function savePanelSettings() {
    var data = collectPanelSettings();
    try { if (typeof localStorage !== 'undefined' && localStorage) localStorage.setItem('f2a.panelSettings', JSON.stringify(data)); } catch (e) {}
    parent.postMessage({ pluginMessage: { type: 'save-settings', settings: data } }, '*');
  }
  function applyPanelSettings(saved) {
    if (!saved || typeof saved !== 'object') return;
    var i, id, el;
    for (i = 0; i < CHECKBOX_SETTINGS.length; i++) {
      id = CHECKBOX_SETTINGS[i]; el = $(id);
      if (el && !dirtySettings[id] && typeof saved[id] === 'boolean') el.checked = saved[id];
    }
    for (i = 0; i < SELECT_SETTINGS.length; i++) {
      id = SELECT_SETTINGS[i]; el = $(id);
      if (el && !dirtySettings[id] && typeof saved[id] === 'string' && hasOption(el, saved[id])) el.value = saved[id];
    }
    updateTextModeHint();
  }
  function bindSettingPersistence() {
    var i;
    for (i = 0; i < CHECKBOX_SETTINGS.length; i++) (function (id) {
      var el = $(id);
      if (el) el.onchange = function () { dirtySettings[id] = true; savePanelSettings(); };
    })(CHECKBOX_SETTINGS[i]);
    for (i = 0; i < SELECT_SETTINGS.length; i++) (function (id) {
      var el = $(id);
      if (el) el.onchange = function () {
        dirtySettings[id] = true;
        if (id === 'text-mode') updateTextModeHint();
        savePanelSettings();
      };
    })(SELECT_SETTINGS[i]);
  }

  function setConn(state) {
    connected = state;
    $('dot').className = 'dot ' + (state ? 'on' : 'off');
    $('conn').textContent = state ? '已连接到 After Effects' : '未找到AE桥接服务，请在AE中打开扩展面板';
    updateButton();
    if (state) readImageFolder().catch(function (error) { say(error.message, 'err'); });
  }
  function updateButton() {
    var busy = locatingLayer || folderBusy || exporting || aepBusy || processingImages || mcpExecuting;
    $('ship').disabled = busy || !(connected && selCount > 0);
    $('image-folder-choose').disabled = busy || !connected;
    $('locate-layer').disabled = busy;
    $('open-aep-folder').disabled = busy || openingFolder;
    var settings = CHECKBOX_SETTINGS.concat(SELECT_SETTINGS);
    for (var i = 0; i < settings.length; i++) $(settings[i]).disabled = busy;
    $('export-aep').disabled = busy || selCount === 0;
    $('mark-raster').disabled = $('unmark-raster').disabled = busy || selCount === 0;
    $('mark-root').disabled = $('unmark-root').disabled = busy || !frameSelected;
    for (var id in toolButtons) $(id).disabled = busy || selCount === 0;
  }
  function say(text, cls, nodeId) {
    var m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || '');
    errorNodeId = nodeId || null; $('locate-layer').hidden = !errorNodeId;
  }
  $('locate-layer').onclick = function () {
    if (!errorNodeId || locatingLayer) return;
    locatingLayer = true; updateButton();
    parent.postMessage({pluginMessage:{type:'locate-layer',nodeId:errorNodeId}}, '*');
  };
  function showImageFolder(directory) {
    imageFolder = directory || '';
    $('image-folder-path').textContent = imageFolder || '未选择';
    $('image-folder-path').title = imageFolder;
  }
  function imageFolderRequest(method) {

                      compDuration: msg.newComp ? selectedNumber('aep-duration', 10) : null,
                      compFrameRate: msg.newComp ? selectedNumber('aep-fps', 30) : null,
                      containers: msg.containers || null, organize: !!msg.organize, imageCount: msg.imageCount || 0, imageBatch: !!msg.imageBatch, vnStats: msg.vnStats || null };
      var kb = Math.round((msg.bytes || msg.svg.length) / 1024);
      if (connected && ws && ws.readyState === 1) { ws.send(JSON.stringify(payload)); say('正在向 AE 发送 ' + kb + ' KB 数据…'); }
      else { shipHttp(payload); }
    }
  };

  bindSettingPersistence();
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      var cachedSettings = localStorage.getItem('f2a.panelSettings');
      if (cachedSettings) applyPanelSettings(JSON.parse(cachedSettings));
    }
  } catch (e) {}
  parent.postMessage({ pluginMessage: { type: 'load-settings' } }, '*');
  connect();
  connectMcp();
</script>
