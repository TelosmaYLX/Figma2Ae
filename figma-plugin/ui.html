<!-- ui.html — Figma plugin iframe. Holds the WebSocket client to the AE bridge. -->
<!-- Only the UI iframe can do network; the main thread (code.js) exports SVG and posts it here. -->
<!-- Plain HTML; no Tailwind or component library. Use the existing :root tokens and dark theme. -->
<!-- MCP is a secondary status line. Reuse .status/.dot, existing text colors and 8px gaps;
     importing remains the only primary action. No extra setup controls in the normal flow. -->
<!-- Refactoring UI constraints (§2.1, §2.8, §3.6): import is primary; AEP export is secondary.
     Layer tools are open beneath export; common settings follow, with advanced settings collapsed.
     The compact AEP version selector shares the export action row; import and export stay adjacent.
     It takes the folder control's --panel fill with a --line edge so the two read alike, and matches the
     action row's 13px type so the version label is not smaller than the button beside it.
     Keep the existing dark tokens, 8px control gaps/radii, 12px panel padding and 16px section spacing.
     Layer-tool buttons sit on a panel, so they use the raised --surface fill and --line edge to read as buttons.
     Node export and mask conversion are standard behavior, not redundant visible switches. -->
<style>
  :root { --bg:#1e1e1e; --panel:#2a2a2a; --surface:#383838; --surface-hover:#464646; --surface-active:#303030; --line:#4b4b4b; --line-hover:#5a5a5a; --accent:#a78bfa; --text:#e8e8e8; --muted:#a3a3a3; --ok:#22c55e; --err:#ef4444; }
  html,body { margin:0; font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Roboto,sans-serif; background:var(--bg); color:var(--text); color-scheme:dark; scrollbar-width:thin; }
  .wrap { padding:14px; box-sizing:border-box; max-width:480px; margin:0 auto; }
  .status { display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--err); }
  button { width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#1a1a1a;
           font-weight:600; cursor:pointer; }
  button:disabled,select:disabled { opacity:.4; cursor:not-allowed; }
  .aep-actions { display:flex; gap:8px; margin-top:8px; }
  .aep-export { flex:1; width:auto; min-width:0; background:var(--panel); color:var(--text); }
  .aep-version { flex:0 0 88px; min-width:88px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .aep-version:hover:not(:disabled) { background:var(--surface); border-color:var(--line-hover); }
  /* The global focus ring is accent purple; on this narrow control it reads as a selected box,
     so the version selector shows focus by fill and edge instead. */
  .aep-version:focus-visible { outline:none; background:var(--surface); border-color:var(--line-hover); }
  .image-folder { margin-bottom:12px; }
  .image-folder-label { margin-bottom:4px; color:var(--text); }
  .image-folder-row { display:flex; align-items:flex-start; gap:8px; }
  .image-folder-path { flex:1; min-width:0; min-height:36px; padding:10px; box-sizing:border-box; border-radius:8px; background:var(--panel); overflow-wrap:anywhere; white-space:normal; user-select:text; }
  .image-folder-choose { flex:0 0 36px; width:36px; height:36px; padding:8px; background:var(--panel); color:var(--text); }
  .image-folder-choose svg { display:block; width:20px; height:20px; }
  .image-folder-choose:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mark-actions { display:flex; gap:8px; margin-top:12px; }
  .mark-actions button { flex:1; min-width:0; }
  details { margin-top:12px; border-radius:8px; background:var(--panel); padding:12px; }
  summary { cursor:pointer; font-weight:600; }
  .tool-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  /* Layer tools sit on a panel surface, so their buttons need a raised fill and a hairline
     edge; panel-colored buttons read as plain text against the panel. */
  .layer-tools button { padding:9px 10px; border:1px solid var(--line); background:var(--surface); color:var(--text); }
  .layer-tools button:hover:not(:disabled) { background:var(--surface-hover); border-color:var(--line-hover); }
  .layer-tools button:active:not(:disabled) { background:var(--surface-active); }
  .layer-tools button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mark-hint { margin-top:8px; font-size:11px; line-height:1.5; color:var(--muted); }
  .msg { margin-top:10px; min-height:16px; color:var(--muted); overflow-wrap:anywhere; }
  .msg:empty { display:none; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .locate-layer,.open-folder { width:auto; margin-top:8px; padding:8px 10px; background:var(--panel); color:var(--text); }
  .locate-layer:focus-visible,.open-folder:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .settings { margin:16px 0 0; padding:12px; border:0; min-width:0; border-radius:8px; background:var(--panel); }
  .settings legend { padding:0 4px; font-weight:600; }
  .option { display:flex; align-items:center; gap:8px; min-height:28px; cursor:pointer; }
  .option input { flex:0 0 auto; margin:0; accent-color:var(--accent); }
  .option-stack { align-items:flex-start; padding:4px 0; }
  .option-stack + .option-stack { margin-top:8px; }
  .option-stack input { margin-top:2px; }
  .option-stack small { display:block; margin-top:4px; font-size:11px; line-height:1.5; color:var(--muted); }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:36px; }
  .setting-row + .setting-row { margin-top:8px; }
  .setting-row select { min-width:88px; max-width:65%; min-height:36px; padding:8px; border:0; border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .advanced-group { margin-top:16px; }
  .advanced-label { margin:0 0 4px; color:var(--muted); font-size:11px; }
  .hint { margin-top:8px; font-size:11px; color:var(--muted); }
</style>
<div class="wrap">
  <div class="status"><span id="dot" class="dot"></span><span id="conn">正在连接 After Effects…</span></div>
  <div class="status" role="status"><span id="mcp-dot" class="dot" aria-hidden="true"></span><span id="mcp-status">MCP 正在连接…</span></div>
  <div class="image-folder">
    <div class="image-folder-label" id="image-folder-label">图片保存位置</div>
    <div class="image-folder-row">
      <div id="image-folder-path" class="image-folder-path" role="status" aria-labelledby="image-folder-label">未选择</div>
      <button type="button" id="image-folder-choose" class="image-folder-choose" title="选择图片保存位置" aria-label="选择图片保存位置" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      </button>
    </div>
  </div>
  <button id="ship" disabled>导入到 After Effects</button>
  <div class="aep-actions">
    <button id="export-aep" class="aep-export" disabled>导出 AEP（实验）</button>
    <select id="aep-version" class="aep-version" aria-label="AEP 导出版本" title="AEP 导出版本">
      <option value="26.0" selected>26.x</option>
      <option value="25.0">25.x</option>
      <option value="24.0">24.x</option>
    </select>
  </div>
  <div id="msg" class="msg"></div>
  <button id="locate-layer" class="locate-layer" title="选中并显示出错图层" hidden>定位图层</button>
  <button type="button" id="open-aep-folder" class="open-folder" hidden>打开文件夹</button>
  <details id="layer-tools" class="layer-tools" open>
    <summary>图层工具</summary>
    <div class="mark-actions">
      <button id="mark-raster" disabled>标记为图片</button>
      <button id="unmark-raster" disabled>取消标记</button>
    </div>
    <div class="mark-hint">名称以 * 开头的图层将导出为图片。</div>
    <div class="tool-actions">
      <button id="detach-instances" disabled>分离实例</button>
      <button id="convert-groups" disabled>Group 转 Frame</button>
      <button id="expand-groups" disabled>展开空分组</button>
      <button id="delete-hidden" disabled>清理隐藏图层</button>
    </div>
  </details>
  <fieldset class="settings">
    <legend>图层</legend>
    <label class="option" title="将 Figma 分组转换为 AE 预合成。"><input type="checkbox" id="organize" checked> 保留分组层级</label>
    <label class="option"><input type="checkbox" id="enableclip" checked> 保留画框裁剪</label>
    <label class="option"><input type="checkbox" id="ignorehidden" checked> 忽略隐藏图层</label>
  </fieldset>
  <fieldset class="settings">
    <legend>文字</legend>
    <div class="setting-row">
      <label for="text-mode">导出方式</label>
      <select id="text-mode" aria-describedby="text-mode-hint">
        <option value="editable">可编辑文字</option>
        <option value="vector" selected>矢量形状（无需字体）</option>
        <option value="png">PNG 图片</option>
      </select>
    </div>
    <div class="hint" id="text-mode-hint">无需本机字体，文字内容不可编辑。</div>
  </fieldset>
  <fieldset class="settings">
    <legend>图片</legend>
    <div class="setting-row">
      <label for="native-image-masks">图片蒙版</label>
      <select id="native-image-masks">
        <option value="separate" selected>原图 + 独立蒙版</option>
        <option value="merge">合并成图片</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="raster-scale">切图倍率</label>
      <select id="raster-scale">
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
      </select>
    </div>
    <div class="hint">倍率只影响栅格化图片。</div>
  </fieldset>
  <details id="advanced-options">
    <summary>高级选项</summary>
    <div class="advanced-group">
      <div class="advanced-label">允许自动转为图片</div>
      <label class="option option-stack"><input type="checkbox" id="raster-effects" checked><span>模糊、阴影和特殊效果<small>投影、内阴影、图层/背景模糊、玻璃、噪点、纹理、着色器，以及图片曝光、对比度等调色。</small></span></label>
      <label class="option option-stack"><input type="checkbox" id="raster-paints" checked><span>特殊填充与描边<small>角度/菱形渐变、视频静帧、图案、着色器。</small></span></label>
      <label class="option option-stack"><input type="checkbox" id="raster-image-crops" checked><span>图片裁剪<small>固定自定义裁剪；独立蒙版中的原图继续保留。</small></span></label>
      <label class="option option-stack"><input type="checkbox" id="raster-masks" checked><span>复杂蒙版<small>图片、渐变或效果蒙版；图片分离时只渲染蒙版。</small></span></label>
      <label class="option option-stack"><input type="checkbox" id="raster-booleans" checked><span>布尔运算结果<small>仅在无法读取结果路径时转为图片。</small></span></label>
      <div class="hint">能原生转换时保留可编辑内容。关闭后无法转换的图层会报错，可定位处理。</div>
      <div class="hint">按所在图层转图；组上的效果可能连同组内内容一起合并。</div>
    </div>
    <div class="advanced-group">
      <div class="advanced-label">混合模式</div>
      <label class="option" title="将混合图层与必要底图合并，保留范围外的可编辑内容。"><input type="checkbox" id="mergeblends" checked> 合并混合模式与底图</label>
    </div>
    <div class="advanced-group">
      <div class="advanced-label">强制转为图片</div>
      <label class="option"><input type="checkbox" id="rasterallgroups"> Group 分组</label>
      <label class="option"><input type="checkbox" id="rasterinstances"> 组件实例</label>
      <div class="hint">转为图片后，内部内容不可单独编辑。</div>
    </div>
    <div class="advanced-group">
      <div class="advanced-label">图片处理</div>
      <label class="option" title="高倍率渲染后缩小，耗时更长；不改变 AE 图层采样。"><input type="checkbox" id="bicubic-export"> 双三次缩小（实验）</label>
    </div>
  </details>
</div>
<script>
  var PORT = 7867;
  var ws = null, connected = false, selCount = 0, imgAsm = null, exporting = false, blendNotice = '';
  var aepMode = false, aepBusy = false, aepPacket = null, aepResultId = null, openingFolder = false;
  var imageFolder = '', folderBusy = false;
  var errorNodeId = null, locatingLayer = false;
  var imageTasks = Promise.resolve(), processingImages = false, imageProcessingFailed = false;
  var $ = function (id) { return document.getElementById(id); };
  var toolButtons = { 'detach-instances': 'detach', 'convert-groups': 'group-to-frame', 'expand-groups': 'expand', 'delete-hidden': 'delete-hidden' };
  var mcpSocket = null, mcpRetryTimer = null, mcpExecuting = false;
  function mcpStatus(on, text) {
    $('mcp-dot').className = 'dot ' + (on ? 'on' : 'off');
    $('mcp-status').textContent = text;
  }
  function mcpSend(message) {
    if (mcpSocket && mcpSocket.readyState === 1) mcpSocket.send(JSON.stringify(message));
  }
  function connectMcp() {
    mcpSocket = new WebSocket('ws://127.0.0.1:7869/plugin');
    mcpSocket.onopen = function () { parent.postMessage({pluginMessage:{type:'mcp-info'}}, '*'); };
    mcpSocket.onmessage = function (event) {
      var message = JSON.parse(event.data);
      if (message.type === 'ready') { mcpStatus(true, 'MCP 已就绪'); return; }
      if (message.type === 'command') parent.postMessage({pluginMessage:{type:'mcp-command', id:message.id, command:message.command, params:message.params}}, '*');
    };
    mcpSocket.onerror = function () { mcpStatus(false, 'MCP 等待 agent 连接'); };
    mcpSocket.onclose = function () {
      mcpStatus(false, 'MCP 等待 agent 连接');
      if (!mcpRetryTimer) mcpRetryTimer = setTimeout(function () { mcpRetryTimer = null; connectMcp(); }, 1500);
    };
  }
  $('text-mode').onchange = function () {
    var hints = {editable:'细描边文字自动转为矢量。',vector:'无需本机字体，文字内容不可编辑。',png:'文字转为图片，内容不可编辑。'};
    $('text-mode-hint').textContent = hints[this.value];
  };

  function setConn(state) {
    connected = state;
    $('dot').className = 'dot ' + (state ? 'on' : 'off');
    $('conn').textContent = state ? '已连接到 After Effects' : '未找到AE桥接服务，请在AE中打开扩展面板';
    updateButton();
    if (state) readImageFolder().catch(function (error) { say(error.message, 'err'); });
  }
  function updateButton() {
    var busy = locatingLayer || folderBusy || exporting || aepBusy || processingImages || mcpExecuting;
    $('ship').disabled = busy || !(connected && selCount > 0);
    $('image-folder-choose').disabled = busy || !connected;
    $('locate-layer').disabled = busy;
    $('open-aep-folder').disabled = busy || openingFolder;
    var settings = ['aep-version','organize','enableclip','ignorehidden','text-mode','native-image-masks','raster-scale','raster-effects','raster-paints','raster-image-crops','raster-masks','raster-booleans','mergeblends','rasterallgroups','rasterinstances','bicubic-export'];
    for (var i = 0; i < settings.length; i++) $(settings[i]).disabled = busy;
    $('export-aep').disabled = busy || selCount === 0;
    $('mark-raster').disabled = $('unmark-raster').disabled = busy || selCount === 0;
    for (var id in toolButtons) $(id).disabled = busy || selCount === 0;
  }
  function say(text, cls, nodeId) {
    var m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || '');
    errorNodeId = nodeId || null; $('locate-layer').hidden = !errorNodeId;
  }
  $('locate-layer').onclick = function () {
    if (!errorNodeId || locatingLayer) return;
    locatingLayer = true; updateButton();
    parent.postMessage({pluginMessage:{type:'locate-layer',nodeId:errorNodeId}}, '*');
  };
  function showImageFolder(directory) {
    imageFolder = directory || '';
    $('image-folder-path').textContent = imageFolder || '未选择';
    $('image-folder-path').title = imageFolder;
  }
  function imageFolderRequest(method) {
    return fetch('http://127.0.0.1:' + PORT + '/image-folder', {method:method}).then(function (response) {
      return response.json().then(function (result) { if (!response.ok) throw new Error(result.error); return result; });
    }).catch(function (error) { throw new Error(error instanceof SyntaxError || error instanceof TypeError ? '请重新打开 AE 的 F2A 面板，再选择图片保存位置。' : '图片保存位置不可用：' + error.message); });
  }
  function readImageFolder() {
    return imageFolderRequest('GET').then(function (result) { showImageFolder(result.directory); return imageFolder; });
  }
  function selectImageFolder() {
    return imageFolderRequest('POST').then(function (result) {
      if (result.directory) showImageFolder(result.directory);
      return result.directory;
    });
  }
  $('image-folder-choose').onclick = function () {
    if (folderBusy || exporting || aepBusy) return;
    folderBusy = true; updateButton();
    selectImageFolder().catch(function (error) { say(error.message, 'err'); }).then(function () { folderBusy = false; updateButton(); });
  };
  window.onfocus = function () { if (connected && !folderBusy && !exporting && !aepBusy) readImageFolder().catch(function (error) { say(error.message, 'err'); }); };

  function connect() {
    try { ws = new WebSocket('ws://127.0.0.1:' + PORT); } catch (e) { setConn(false); return retry(); }
    ws.onopen = function () { setConn(true); };
    ws.onclose = function () { setConn(false); retry(); };
    ws.onerror = function () { setConn(false); };
    ws.onmessage = function (ev) {
      try {
        var ack = JSON.parse(ev.data);
        if (errorNodeId) return;
        if (ack.ok) say('完成——' + (ack.shapes != null ? '已在 AE 中创建 ' + ack.shapes + ' 个形状图层。' : '已发送到 AE。') + blendNotice, 'ok');
        else say('AE 错误：' + (ack.error || '未知错误'), 'err');
      } catch (e) { say('已发送。', 'ok'); }
    };
  }
  var retryTimer = null;
  function retry() { if (retryTimer) return; retryTimer = setTimeout(function () { retryTimer = null; connect(); }, 1500); }

  // HTTP fallback if WS is unavailable (some locked-down setups)
  function shipHttp(payload) {
    fetch('http://127.0.0.1:' + PORT, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (ack) { if (!errorNodeId && payload.type !== 'export-abort') say(ack.ok ? '完成（HTTP）——' + (ack.shapes||'') + ' 个形状。' + blendNotice : 'AE 错误：' + ack.error, ack.ok ? 'ok' : 'err'); })
      .catch(function () { if (!errorNodeId && payload.type !== 'export-abort') say('无法连接端口 ' + PORT + ' 上的 AE 桥接服务。', 'err'); });
  }

  var organize = false, bridgePending = false;
  $('mark-raster').onclick = function () { parent.postMessage({ pluginMessage: { type: 'mark-raster' } }, '*'); };
  $('unmark-raster').onclick = function () { parent.postMessage({ pluginMessage: { type: 'unmark-raster' } }, '*'); };
  for (var toolId in toolButtons) (function (id) {
    $(id).onclick = function () { parent.postMessage({ pluginMessage: { type: 'layer-tool', action: toolButtons[id] } }, '*'); };
  })(toolId);
  function beginExport(direct) {
    // Nodes and mask conversion are standard for both destinations.
    organize = $('organize').checked;
    aepMode = direct; aepPacket = null; imgAsm = null;
    imageTasks = Promise.resolve(); processingImages = imageProcessingFailed = false;
    aepResultId = null; $('open-aep-folder').hidden = true;
    exporting = true; updateButton();
    blendNotice = '';
    say(organize ? '正在导出可编辑分组…' : '正在导出…');
    parent.postMessage({ pluginMessage: { type: 'ship-selection', target: direct ? 'aep' : 'ae', useNodes: true, organize: organize, rasterScale: Number($('raster-scale').value), bicubicExport: $('bicubic-export').checked, nativeImageMasks: $('native-image-masks').value === 'separate', ignoreHidden: $('ignorehidden').checked, convertMasks: true, rasterize: {effects: $('raster-effects').checked, paints: $('raster-paints').checked, imageCrops: $('raster-image-crops').checked, masks: $('raster-masks').checked, booleans: $('raster-booleans').checked}, mergeBlends: $('mergeblends').checked, outlineTexts: $('text-mode').value === 'vector', rasterTexts: $('text-mode').value === 'png', rasterAllGroups: $('rasterallgroups').checked, rasterInstances: $('rasterinstances').checked, enableClip: $('enableclip').checked } }, '*');
  }
  $('ship').onclick = function () {
    if (folderBusy || exporting || aepBusy) return;
    folderBusy = true; updateButton();
    readImageFolder().then(function (directory) { return directory || selectImageFolder(); }).then(function (directory) {
      folderBusy = false; updateButton();
      if (!directory) { say('已取消导入。'); return; }
      beginExport(false);
    }).catch(function (error) { folderBusy = false; updateButton(); say(error.message, 'err'); });
  };
  function aepHealth() {
    return fetch('http://127.0.0.1:7868/health').then(function (r) {
      if (!r.ok) throw new Error('AEP service unavailable');
      return r.json();
    });
  }
  function ensureAepService() {
    return aepHealth().catch(function () {
      say('正在启动 AEP 导出服务…');
      return fetch('http://127.0.0.1:' + PORT + '/aep/start', {method:'POST'}).then(function (response) {
        return response.json().then(function (result) {
          if (!response.ok) throw new Error(result.error);
          if (!result.ok) throw new Error('请更新并重新打开 AE 的 F2A 面板。');
        });
      }).catch(function (error) {
        if (error.name === 'TypeError' || error.name === 'SyntaxError') throw new Error('请先打开 AE 的 F2A 面板，再导出 AEP。');
        throw error;
      }).then(function () { return new Promise(function (resolve, reject) {
        var deadline = Date.now() + 60000;
        function probe() {
          aepHealth().then(resolve).catch(function () {
            if (Date.now() >= deadline) reject(new Error('AEP 服务启动超时，请查看组件的 artifacts/aep-service 日志。'));
            else setTimeout(probe, 500);
          });
        }
        probe();
      }); });
    }).then(function (info) {
      if (info.service !== 'f2a-aep' || info.version !== 3) throw new Error('AEP 导出服务版本不匹配，请重启服务。');
      if (!info.aeVersions || info.aeVersions.indexOf($('aep-version').value) === -1) throw new Error('请更新 AEP 导出组件后重启服务。');
    });
  }
  $('export-aep').onclick = function () {
    if (exporting || aepBusy || folderBusy) return;
    aepBusy = true; aepResultId = null; $('open-aep-folder').hidden = true; updateButton();
    say('正在连接 AEP 导出服务…');
    ensureAepService().then(function () { beginExport(true); }).catch(function (err) {
      aepBusy = false; updateButton();
      say(err.message, 'err');
    });
  };
  function aepRequest(route, body) {
    return fetch('http://127.0.0.1:7868' + route, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(function (response) {
      return response.json().then(function (result) {
        if (!response.ok) { var error = new Error(result.error); error.nodeId = result.nodeId || null; throw error; }
        return result;
      });
    });
  }
  $('open-aep-folder').onclick = function () {
    if (!aepResultId || openingFolder || exporting || aepBusy) return;
    openingFolder = true; updateButton();
    aepRequest('/open-directory', {exportId:aepResultId}).catch(function (error) {
      say('无法打开文件夹：' + error.message, 'err');
    }).then(function () { openingFolder = false; updateButton(); });
  };

  // Figma embeds this HTML; keep the same source-over solve as client/figmaRasterEffects.js inline.
  function extractAepShadow(full, clean) {
    var out = new Uint8ClampedArray(full.length);
    for (var i = 0; i < full.length; i += 4) {
      var af = full[i + 3] / 255, ac = clean[i + 3] / 255, remaining = 1 - ac;
      if (remaining < 1 / 255 || af <= ac) continue;
      var alpha = Math.max(0, Math.min(1, (af - ac) / remaining));
      out[i + 3] = Math.round(alpha * 255);
      for (var c = 0; c < 3; c++) out[i + c] = Math.max(0, Math.min(255, (full[i + c] * af - clean[i + c] * ac) / (remaining * alpha)));
    }
    return out;
  }
  function renderAepShadow(full, base) {
    function load(data) { return new Promise(function (resolve, reject) {
      var image = new Image(); image.onload = function () { resolve(image); };
      image.onerror = function () { reject(new Error('无法读取投影图片')); };
      image.src = 'data:image/png;base64,' + data;
    }); }
    return Promise.all([load(full), load(base.data)]).then(function (images) {
      var canvas = document.createElement('canvas'), clean = document.createElement('canvas');
      canvas.width = clean.width = images[0].naturalWidth; canvas.height = clean.height = images[0].naturalHeight;
      var context = canvas.getContext('2d'), cleanContext = clean.getContext('2d');
      context.drawImage(images[0], 0, 0); cleanContext.drawImage(images[1], base.dx, base.dy, base.w, base.h);
      var pixels = context.getImageData(0, 0, canvas.width, canvas.height);
      pixels.data.set(extractAepShadow(pixels.data, cleanContext.getImageData(0, 0, canvas.width, canvas.height).data));
      context.putImageData(pixels, 0, 0);
      return canvas.toDataURL('image/png').split(',')[1];
    });
  }
  // Scale-aware Catmull-Rom bicubic filtering in premultiplied RGBA avoids dark alpha fringes.
  function bicubicRgba(source, sw, sh, width, height) {
    function kernel(x) {
      x = Math.abs(x);
      return x < 1 ? 1.5*x*x*x - 2.5*x*x + 1 : x < 2 ? -.5*x*x*x + 2.5*x*x - 4*x + 2 : 0;
    }
    function weights(input, output) {
      var table = [], ratio = input/output, filter = Math.max(1, ratio);
      for (var n = 0; n < output; n++) {
        var center = (n+.5)*ratio-.5, list = [], sum = 0;
        for (var p = Math.ceil(center-2*filter); p <= Math.floor(center+2*filter); p++) {
          var weight = kernel((p-center)/filter);
          if (weight) { list.push([Math.max(0, Math.min(input-1, p)), weight]); sum += weight; }
        }
        for (var j = 0; j < list.length; j++) list[j][1] /= sum;
        table.push(list);
      }
      return table;
    }
    var wx = weights(sw, width), wy = weights(sh, height);
    var horizontal = new Float32Array(width*sh*4), result = new Uint8ClampedArray(width*height*4);
    for (var y = 0; y < sh; y++) for (var x = 0; x < width; x++) {
      var out = (y*width+x)*4, taps = wx[x];
      for (var k = 0; k < taps.length; k++) {
        var at = (y*sw+taps[k][0])*4, w = taps[k][1], a = source[at+3]/255;
        for (var c = 0; c < 3; c++) horizontal[out+c] += source[at+c]*a*w;
        horizontal[out+3] += source[at+3]*w;
      }
    }
    for (var y = 0; y < height; y++) for (var x = 0; x < width; x++) {
      var out = (y*width+x)*4, taps = wy[y], rgba = [0,0,0,0];
      for (var k = 0; k < taps.length; k++) {
        var at = (taps[k][0]*width+x)*4, w = taps[k][1];
        for (var c = 0; c < 4; c++) rgba[c] += horizontal[at+c]*w;
      }
      result[out+3] = rgba[3];
      if (rgba[3] > 0) for (var c = 0; c < 3; c++) result[out+c] = rgba[c]*255/rgba[3];
    }
    return result;
  }
  function renderBicubic(image) {
    return new Promise(function (resolve, reject) {
      var bitmap = new Image();
      bitmap.onerror = function () { reject(new Error('双三次图片读取失败')); };
      bitmap.onload = function () {
        try {
          var canvas = document.createElement('canvas'), output = document.createElement('canvas');
          canvas.width = bitmap.naturalWidth; canvas.height = bitmap.naturalHeight;
          var context = canvas.getContext('2d'); context.drawImage(bitmap, 0, 0);
          var target = image.bicubic; output.width = target.width; output.height = target.height;
          var out = output.getContext('2d'), pixels = out.createImageData(target.width, target.height);
          pixels.data.set(bicubicRgba(context.getImageData(0,0,canvas.width,canvas.height).data,
            canvas.width, canvas.height, target.width, target.height));
          out.putImageData(pixels, 0, 0);
          image.data = output.toDataURL('image/png').split(',')[1]; image.ext = 'png';
          image.natW = target.width; image.natH = target.height; image.bicubic = null;
          resolve();
        } catch (error) { reject(error); }
      };
      bitmap.src = 'data:image/' + (image.ext === 'jpg' ? 'jpeg' : image.ext) + ';base64,' + image.data;
    });
  }
  function prepareImage(image) {
    var prepared = Promise.resolve();
    if (image.shadowBase) prepared = prepared.then(function () {
      return renderAepShadow(image.data, image.shadowBase).then(function (data) { image.data = data; image.shadowBase = null; });
    });
    if (image.bicubic) prepared = prepared.then(function () { return renderBicubic(image); });
    return prepared.catch(function (error) {
      var failure = new Error((image.shadowBase ? '投影' : '图片') + '「' + image.name + '」处理失败：' + error.message); failure.nodeId = image.sourceId; throw failure;
    });
  }
  function finishAep() {
    if (!aepPacket) return;
    var packet = aepPacket; aepPacket = null;
    packet.aeVersion = $('aep-version').value;
    if (packet.images.length !== packet.imageCount) {
      aepMode = aepBusy = false; updateButton();
      say('部分图片导出失败，请重试。', 'err'); return;
    }
    say('正在检查并生成 AEP…');
    var prepared = Promise.resolve();
    packet.images.forEach(function (image) {
      if (image.shadowBase || image.bicubic) prepared = prepared.then(function () { return prepareImage(image); });
    });
    prepared.then(function () {
      return aepRequest('/export', {packet:packet});
    })
      .then(function (result) {
        if (result.cancelled) { say('已取消导出。'); return; }
        if (result.warnings.length) {
          var issue = result.warnings[0];
          throw new Error('图层「' + (issue.layer || '未知') + '」：' + (issue.detail || issue.code || '存在未导出的属性'));
        }
        say('已导出到 ' + result.directory, 'ok');
        aepResultId = result.exportId; $('open-aep-folder').hidden = false;
      }).catch(function (err) { say('AEP 导出失败：' + err.message, 'err', err.nodeId); })
      .then(function () { aepMode = aepBusy = false; updateButton(); });
  }

  // messages from code.js (main thread)
  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'mcp-info') { mcpSend({type:'hello', name:msg.name, fileKey:msg.fileKey, pageId:msg.pageId, pageName:msg.pageName}); return; }
    if (msg.type === 'mcp-result') { mcpSend({type:'result', id:msg.id, result:msg.result, error:msg.error}); return; }
    if (msg.type === 'command_progress') { mcpSend({type:'progress', id:msg.commandId}); return; }
    if (msg.type === 'mcp-busy') { mcpExecuting = msg.busy; updateButton(); return; }
    if (msg.type === 'image-abort') msg = {type:'error',message:'图片导出失败，已取消导出'};
    if (msg.type === 'selection') { selCount = msg.count; updateButton(); }
    if (msg.type === 'locate-result') {
      locatingLayer = false; updateButton();
      if (!msg.ok) say(msg.message, 'err');
    }
    if (msg.type === 'export-state') { exporting = msg.busy; updateButton(); }
    if (msg.type === 'mark-result') { say(msg.message, 'ok'); }
    if (msg.type === 'tool-result') { say(msg.message, 'ok'); }
    if (msg.type === 'error') {
      processingImages = false; imageProcessingFailed = true;
      if (bridgePending) {
        var abort = {type: 'export-abort', message: msg.message};
        if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(abort));
        else shipHttp(abort);
      }
      bridgePending = false; exporting = aepBusy = aepMode = false; aepPacket = imgAsm = null; updateButton(); say(msg.message, 'err', msg.nodeId);
    }
    if (msg.type === 'progress') { say(msg.message); }
    if (msg.type === 'images-done') {
      if (aepMode) { finishAep(); return; }
      imageTasks.then(function () {
        if (imageProcessingFailed) return;
        bridgePending = processingImages = false; updateButton();
        var done = { type: 'images-complete' };
        if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(done));
        else shipHttp(done);
      }).catch(function (error) {
        processingImages = false;
        window.onmessage({data:{pluginMessage:{type:'error',message:error.message,nodeId:error.nodeId}}});
      });
      return;
    }
    if (msg.type === 'image-chunk') {
      // reassemble ~1MB base64 string chunks (strings cross the sandbox cheaply)
      if (msg.seq === 0) { imgAsm = { meta: msg.meta, parts: [] }; }
      if (!imgAsm) return;
      imgAsm.parts.push(msg.dataPart);
      say('正在接收图片 ' + (msg.index + 1) + '/' + msg.total + '（分片 ' + (msg.seq + 1) + '/' + msg.parts + '）…');
      if (msg.seq === msg.parts - 1) {
        var img = imgAsm.meta; img.data = imgAsm.parts.join(''); imgAsm = null;
        if (aepMode) { if (aepPacket) aepPacket.images.push(img); return; }
        function sendImage() {
          if (imageProcessingFailed) return;
          var ip = { type: 'image', index: msg.index, total: msg.total, image: img };
          if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(ip));
          else shipHttp(ip);
        }
        if (img.bicubic) {
          processingImages = true; updateButton();
          imageTasks = imageTasks.then(function () {
            if (!imageProcessingFailed) return prepareImage(img).then(sendImage);
          }).catch(function (error) {
            window.onmessage({data:{pluginMessage:{type:'error',message:error.message,nodeId:error.nodeId}}});
          });
        } else sendImage();
      }
      return;
    }
    if (msg.type === 'ship') {
      bridgePending = !aepMode && msg.imageCount > 0;
      blendNotice = msg.blendStats && msg.blendStats.external ? ' 部分叠加依赖选区外的底图，请选择更外层画框。' : '';
      if (!msg.svg || msg.svg.indexOf('<svg') === -1) { exporting = aepMode = aepBusy = false; updateButton(); say('没有可发送的内容——Figma 导出的 SVG 为空。', 'err'); return; }
      if (aepMode) {
        aepPacket = {name: msg.name, frame: msg.frame, svg: msg.svg, nodes: msg.nodes, texts: msg.texts,
          effects: msg.effects, shift: msg.shift, containers: msg.containers, organize: msg.organize,
          imageCount: msg.imageCount || 0, images: []};
        if (!aepPacket.imageCount) finishAep();
        return;
      }
      var payload = { type: 'svg', name: msg.name, svg: msg.svg, texts: msg.texts || [], effects: msg.effects || [], shift: msg.shift || { x: 0, y: 0 }, nodes: msg.nodes || null,
                      containers: msg.containers || null, organize: !!msg.organize, imageCount: msg.imageCount || 0, imageBatch: !!msg.imageBatch, vnStats: msg.vnStats || null };
      var kb = Math.round((msg.bytes || msg.svg.length) / 1024);
      if (connected && ws && ws.readyState === 1) { ws.send(JSON.stringify(payload)); say('正在向 AE 发送 ' + kb + ' KB 数据…'); }
      else { shipHttp(payload); }
    }
  };

  connect();
  connectMcp();
</script>
