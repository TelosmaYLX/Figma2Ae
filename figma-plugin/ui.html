<!-- ui.html — Figma plugin iframe. Holds the WebSocket client to the AE bridge. -->
<!-- Only the UI iframe can do network; the main thread (code.js) exports SVG and posts it here. -->
<!-- Plain HTML; no Tailwind or component library. Use the existing :root tokens and dark theme. -->
<!-- Primary: import. Secondary: direct AEP export, marking and document tools. Existing tokens, 8px gaps/radii,
     10px button padding and 12px group spacing; retain the current dark theme. The shared image
     folder is secondary: full selectable address, 8px gap, 36px folder button.
     Status text leads; optional locate/open-folder actions are secondary, using panel/text tokens and an 8px gap.
     Raster scale is a labelled secondary setting: 12px group spacing, 8px gap/radius and a 36px native select. -->
<style>
  :root { --bg:#1e1e1e; --panel:#2a2a2a; --accent:#a78bfa; --text:#e8e8e8; --muted:#8a8a8a; --ok:#22c55e; --err:#ef4444; }
  html,body { margin:0; font:12px/1.4 -apple-system,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { padding:14px; }
  .status { display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--ok); } .dot.off { background:var(--err); }
  button { width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#1a1a1a;
           font-weight:600; cursor:pointer; }
  button:disabled,select:disabled { opacity:.4; cursor:not-allowed; }
  .aep-export { margin-top:8px; background:var(--panel); color:var(--text); }
  .image-folder { margin-bottom:12px; }
  .image-folder-label { margin-bottom:4px; color:var(--text); }
  .image-folder-row { display:flex; align-items:flex-start; gap:8px; }
  .image-folder-path { flex:1; min-width:0; min-height:36px; padding:10px; box-sizing:border-box; border-radius:8px; background:var(--panel); overflow-wrap:anywhere; white-space:normal; user-select:text; }
  .image-folder-choose { flex:0 0 36px; width:36px; height:36px; padding:8px; background:var(--panel); color:var(--text); }
  .image-folder-choose svg { display:block; width:20px; height:20px; }
  .image-folder-choose:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mark-actions { display:flex; gap:8px; margin-top:12px; }
  .mark-actions button { flex:1; min-width:0; background:var(--panel); color:var(--text); }
  .layer-tools { margin-top:12px; }
  .layer-tools summary { cursor:pointer; font-weight:600; }
  .tool-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .tool-actions button { background:var(--panel); color:var(--text); }
  .mark-hint { margin-top:8px; color:var(--muted); }
  .msg { margin-top:10px; min-height:16px; color:var(--muted); overflow-wrap:anywhere; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .locate-layer,.open-folder { width:auto; margin-top:8px; padding:8px 10px; background:var(--panel); color:var(--text); }
  .locate-layer:focus-visible,.open-folder:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .raster-scale { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  .raster-scale select { min-width:80px; min-height:36px; padding:8px 10px; border:0; border-radius:8px; background:var(--panel); color:var(--text); font:inherit; color-scheme:dark; }
  .raster-scale select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hint { margin-top:12px; font-size:11px; color:var(--muted); }
</style>
<div class="wrap">
  <div class="status"><span id="dot" class="dot"></span><span id="conn">正在连接 After Effects…</span></div>
  <div class="image-folder">
    <div class="image-folder-label" id="image-folder-label">图片保存位置</div>
    <div class="image-folder-row">
      <div id="image-folder-path" class="image-folder-path" role="status" aria-labelledby="image-folder-label">未选择</div>
      <button type="button" id="image-folder-choose" class="image-folder-choose" title="选择图片保存位置" aria-label="选择图片保存位置" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      </button>
    </div>
  </div>
  <button id="ship" disabled>导入到 After Effects</button>
  <button id="export-aep" class="aep-export" disabled>导出 AEP（实验）</button>
  <div class="mark-actions">
    <button id="mark-raster" disabled>标记栅格化</button>
    <button id="unmark-raster" disabled>取消标记</button>
  </div>
  <div class="mark-hint">名称以 * 开头的图层将导出为图片。</div>
  <div id="msg" class="msg"></div>
  <button id="locate-layer" class="locate-layer" title="选中并显示出错图层" hidden>定位图层</button>
  <button type="button" id="open-aep-folder" class="open-folder" hidden>打开文件夹</button>
  <div class="raster-scale">
    <label for="raster-scale">切图倍率</label>
    <select id="raster-scale">
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="3">3×</option>
      <option value="4">4×</option>
    </select>
  </div>
  <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="nodemode" checked> 可编辑图层
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="rastertexts"> 文字自动栅格化
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="organize" checked> 将 Figma 组转换为预合成（推荐）
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="ignorehidden" checked> 忽略隐藏图层（默认）
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="rastergroups" checked> 自动栅格化复杂组
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer" title="将叠加层与必要底图合并，保留范围外的可编辑图层。">
    <input type="checkbox" id="mergeblends" checked> 合并叠加模式图层
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="rasterallgroups"> Group 整组栅格化
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="rasterinstances"> 实例整体栅格化
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="enableclip" checked> 保留画框裁剪
  </label>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="convertmask"> 转换 Figma 蒙版为 AE 轨道遮罩（实验）
  </label>
  <div class="hint">整体栅格化会合并组内图层。</div>
  <details id="layer-tools" class="layer-tools">
    <summary>图层工具</summary>
    <div class="tool-actions">
      <button id="detach-instances" disabled>分离实例</button>
      <button id="convert-groups" disabled>Group 转 Frame</button>
      <button id="expand-groups" disabled>展开空分组</button>
      <button id="delete-hidden" disabled>清理隐藏图层</button>
    </div>
    <div class="hint">作用于所选内容，可在 Figma 中撤销。</div>
  </details>
</div>
<script>
  var PORT = 7867;
  var ws = null, connected = false, selCount = 0, imgAsm = null, exporting = false, blendNotice = '';
  var aepMode = false, aepBusy = false, aepPacket = null, aepResultId = null, openingFolder = false;
  var imageFolder = '', folderBusy = false;
  var errorNodeId = null, locatingLayer = false;
  var $ = function (id) { return document.getElementById(id); };
  var toolButtons = { 'detach-instances': 'detach', 'convert-groups': 'group-to-frame', 'expand-groups': 'expand', 'delete-hidden': 'delete-hidden' };

  function setConn(state) {
    connected = state;
    $('dot').className = 'dot ' + (state ? 'on' : 'off');
    $('conn').textContent = state ? '已连接到 After Effects' : '未找到 AE 桥接服务——F2A 面板是否已打开？';
    updateButton();
    if (state) readImageFolder().catch(function (error) { say(error.message, 'err'); });
  }
  function updateButton() {
    var busy = locatingLayer || folderBusy || exporting || aepBusy;
    $('ship').disabled = busy || !(connected && selCount > 0);
    $('image-folder-choose').disabled = busy || !connected;
    $('locate-layer').disabled = busy;
    $('open-aep-folder').disabled = busy || openingFolder;
    $('raster-scale').disabled = busy;
    $('export-aep').disabled = busy || selCount === 0;
    $('mark-raster').disabled = $('unmark-raster').disabled = busy || selCount === 0;
    for (var id in toolButtons) $(id).disabled = busy || selCount === 0;
  }
  function say(text, cls, nodeId) {
    var m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || '');
    errorNodeId = nodeId || null; $('locate-layer').hidden = !errorNodeId;
  }
  $('locate-layer').onclick = function () {
    if (!errorNodeId || locatingLayer) return;
    locatingLayer = true; updateButton();
    parent.postMessage({pluginMessage:{type:'locate-layer',nodeId:errorNodeId}}, '*');
  };
  function showImageFolder(directory) {
    imageFolder = directory || '';
    $('image-folder-path').textContent = imageFolder || '未选择';
    $('image-folder-path').title = imageFolder;
  }
  function imageFolderRequest(method) {
    return fetch('http://127.0.0.1:' + PORT + '/image-folder', {method:method}).then(function (response) {
      return response.json().then(function (result) { if (!response.ok) throw new Error(result.error); return result; });
    }).catch(function (error) { throw new Error(error instanceof SyntaxError || error instanceof TypeError ? '请重新打开 AE 的 F2A 面板，再选择图片保存位置。' : '图片保存位置不可用：' + error.message); });
  }
  function readImageFolder() {
    return imageFolderRequest('GET').then(function (result) { showImageFolder(result.directory); return imageFolder; });
  }
  function selectImageFolder() {
    return imageFolderRequest('POST').then(function (result) {
      if (result.directory) showImageFolder(result.directory);
      return result.directory;
    });
  }
  $('image-folder-choose').onclick = function () {
    if (folderBusy || exporting || aepBusy) return;
    folderBusy = true; updateButton();
    selectImageFolder().catch(function (error) { say(error.message, 'err'); }).then(function () { folderBusy = false; updateButton(); });
  };
  window.onfocus = function () { if (connected && !folderBusy && !exporting && !aepBusy) readImageFolder().catch(function (error) { say(error.message, 'err'); }); };

  function connect() {
    try { ws = new WebSocket('ws://127.0.0.1:' + PORT); } catch (e) { setConn(false); return retry(); }
    ws.onopen = function () { setConn(true); };
    ws.onclose = function () { setConn(false); retry(); };
    ws.onerror = function () { setConn(false); };
    ws.onmessage = function (ev) {
      try {
        var ack = JSON.parse(ev.data);
        if (errorNodeId) return;
        if (ack.ok) say('完成——' + (ack.shapes != null ? '已在 AE 中创建 ' + ack.shapes + ' 个形状图层。' : '已发送到 AE。') + blendNotice, 'ok');
        else say('AE 错误：' + (ack.error || '未知错误'), 'err');
      } catch (e) { say('已发送。', 'ok'); }
    };
  }
  var retryTimer = null;
  function retry() { if (retryTimer) return; retryTimer = setTimeout(function () { retryTimer = null; connect(); }, 1500); }

  // HTTP fallback if WS is unavailable (some locked-down setups)
  function shipHttp(payload) {
    fetch('http://127.0.0.1:' + PORT, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (ack) { if (!errorNodeId && payload.type !== 'export-abort') say(ack.ok ? '完成（HTTP）——' + (ack.shapes||'') + ' 个形状。' + blendNotice : 'AE 错误：' + ack.error, ack.ok ? 'ok' : 'err'); })
      .catch(function () { if (!errorNodeId && payload.type !== 'export-abort') say('无法连接端口 ' + PORT + ' 上的 AE 桥接服务。', 'err'); });
  }

  var organize = false, bridgePending = false;
  $('mark-raster').onclick = function () { parent.postMessage({ pluginMessage: { type: 'mark-raster' } }, '*'); };
  $('unmark-raster').onclick = function () { parent.postMessage({ pluginMessage: { type: 'unmark-raster' } }, '*'); };
  for (var toolId in toolButtons) (function (id) {
    $(id).onclick = function () { parent.postMessage({ pluginMessage: { type: 'layer-tool', action: toolButtons[id] } }, '*'); };
  })(toolId);
  $('layer-tools').ontoggle = function () { parent.postMessage({ pluginMessage: { type: 'tools-open', open: this.open } }, '*'); };
  function beginExport(direct) {
    // Precomps require the Figma tree. Editable node mode is now the default: it avoids the
    // old SVG behaviour where every paint became another AE layer.
    organize = $('organize').checked;
    var useNodes = direct || $('nodemode').checked || organize;
    aepMode = direct; aepPacket = null; imgAsm = null;
    aepResultId = null; $('open-aep-folder').hidden = true;
    exporting = true; updateButton();
    blendNotice = '';
    say(organize ? '正在导出可编辑分组…' : '正在导出…');
    parent.postMessage({ pluginMessage: { type: 'ship-selection', useNodes: useNodes, organize: organize, rasterScale: Number($('raster-scale').value), ignoreHidden: $('ignorehidden').checked, convertMasks: $('convertmask').checked, rasterGroups: $('rastergroups').checked, mergeBlends: $('mergeblends').checked, rasterTexts: $('rastertexts').checked, rasterAllGroups: $('rasterallgroups').checked, rasterInstances: $('rasterinstances').checked, enableClip: $('enableclip').checked } }, '*');
  }
  $('ship').onclick = function () {
    if (folderBusy || exporting || aepBusy) return;
    folderBusy = true; updateButton();
    readImageFolder().then(function (directory) { return directory || selectImageFolder(); }).then(function (directory) {
      folderBusy = false; updateButton();
      if (!directory) { say('已取消导入。'); return; }
      beginExport(false);
    }).catch(function (error) { folderBusy = false; updateButton(); say(error.message, 'err'); });
  };
  function aepHealth() {
    return fetch('http://127.0.0.1:7868/health').then(function (r) {
      if (!r.ok) throw new Error('AEP service unavailable');
      return r.json();
    });
  }
  function ensureAepService() {
    return aepHealth().catch(function () {
      say('正在启动 AEP 导出服务…');
      return fetch('http://127.0.0.1:' + PORT + '/aep/start', {method:'POST'}).then(function (response) {
        return response.json().then(function (result) {
          if (!response.ok) throw new Error(result.error);
          if (!result.ok) throw new Error('请更新并重新打开 AE 的 F2A 面板。');
        });
      }).catch(function (error) {
        if (error.name === 'TypeError' || error.name === 'SyntaxError') throw new Error('请先打开 AE 的 F2A 面板，再导出 AEP。');
        throw error;
      }).then(function () { return new Promise(function (resolve, reject) {
        var deadline = Date.now() + 60000;
        function probe() {
          aepHealth().then(resolve).catch(function () {
            if (Date.now() >= deadline) reject(new Error('AEP 服务启动超时，请查看组件的 artifacts/aep-service 日志。'));
            else setTimeout(probe, 500);
          });
        }
        probe();
      }); });
    }).then(function (info) {
      if (info.service !== 'f2a-aep' || info.version !== 3) throw new Error('AEP 导出服务版本不匹配，请重启服务。');
    });
  }
  $('export-aep').onclick = function () {
    if (exporting || aepBusy || folderBusy) return;
    aepBusy = true; aepResultId = null; $('open-aep-folder').hidden = true; updateButton();
    say('正在连接 AEP 导出服务…');
    ensureAepService().then(function () { beginExport(true); }).catch(function (err) {
      aepBusy = false; updateButton();
      say(err.message, 'err');
    });
  };
  function aepRequest(route, body) {
    return fetch('http://127.0.0.1:7868' + route, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(function (response) {
      return response.json().then(function (result) { if (!response.ok) throw new Error(result.error); return result; });
    });
  }
  $('open-aep-folder').onclick = function () {
    if (!aepResultId || openingFolder || exporting || aepBusy) return;
    openingFolder = true; updateButton();
    aepRequest('/open-directory', {exportId:aepResultId}).catch(function (error) {
      say('无法打开文件夹：' + error.message, 'err');
    }).then(function () { openingFolder = false; updateButton(); });
  };

  // Figma embeds this HTML; keep the same source-over solve as client/figmaRasterEffects.js inline.
  function extractAepShadow(full, clean) {
    var out = new Uint8ClampedArray(full.length);
    for (var i = 0; i < full.length; i += 4) {
      var af = full[i + 3] / 255, ac = clean[i + 3] / 255, remaining = 1 - ac;
      if (remaining < 1 / 255 || af <= ac) continue;
      var alpha = Math.max(0, Math.min(1, (af - ac) / remaining));
      out[i + 3] = Math.round(alpha * 255);
      for (var c = 0; c < 3; c++) out[i + c] = Math.max(0, Math.min(255, (full[i + c] * af - clean[i + c] * ac) / (remaining * alpha)));
    }
    return out;
  }
  function renderAepShadow(full, base) {
    function load(data) { return new Promise(function (resolve, reject) {
      var image = new Image(); image.onload = function () { resolve(image); };
      image.onerror = function () { reject(new Error('无法读取投影图片')); };
      image.src = 'data:image/png;base64,' + data;
    }); }
    return Promise.all([load(full), load(base.data)]).then(function (images) {
      var canvas = document.createElement('canvas'), clean = document.createElement('canvas');
      canvas.width = clean.width = images[0].naturalWidth; canvas.height = clean.height = images[0].naturalHeight;
      var context = canvas.getContext('2d'), cleanContext = clean.getContext('2d');
      context.drawImage(images[0], 0, 0); cleanContext.drawImage(images[1], base.dx, base.dy, base.w, base.h);
      var pixels = context.getImageData(0, 0, canvas.width, canvas.height);
      pixels.data.set(extractAepShadow(pixels.data, cleanContext.getImageData(0, 0, canvas.width, canvas.height).data));
      context.putImageData(pixels, 0, 0);
      return canvas.toDataURL('image/png').split(',')[1];
    });
  }
  function finishAep() {
    if (!aepPacket) return;
    var packet = aepPacket; aepPacket = null;
    if (packet.images.length !== packet.imageCount) {
      aepMode = aepBusy = false; updateButton();
      say('部分图片导出失败，请重试。', 'err'); return;
    }
    say('正在检查并生成 AEP…');
    var prepared = Promise.resolve();
    packet.images.forEach(function (image) {
      if (image.shadowBase) prepared = prepared.then(function () {
        return renderAepShadow(image.data, image.shadowBase).then(function (data) {
          image.data = data; image.shadowBase = null;
        }, function (error) { var failure = new Error('投影「' + image.name + '」处理失败：' + error.message); failure.nodeId = image.sourceId; throw failure; });
      });
    });
    prepared.then(function () {
      return aepRequest('/export', {packet:packet});
    })
      .then(function (result) {
        if (result.cancelled) { say('已取消导出。'); return; }
        if (result.warnings.length) {
          var issue = result.warnings[0];
          throw new Error('图层「' + (issue.layer || '未知') + '」：' + (issue.detail || issue.code || '存在未导出的属性'));
        }
        say('已导出到 ' + result.directory, 'ok');
        aepResultId = result.exportId; $('open-aep-folder').hidden = false;
      }).catch(function (err) { say('AEP 导出失败：' + err.message, 'err', err.nodeId); })
      .then(function () { aepMode = aepBusy = false; updateButton(); });
  }

  // messages from code.js (main thread)
  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'image-abort') msg = {type:'error',message:'图片导出失败，已取消导出'};
    if (msg.type === 'selection') { selCount = msg.count; updateButton(); }
    if (msg.type === 'locate-result') {
      locatingLayer = false; updateButton();
      if (!msg.ok) say(msg.message, 'err');
    }
    if (msg.type === 'export-state') { exporting = msg.busy; updateButton(); }
    if (msg.type === 'mark-result') { say(msg.message, 'ok'); }
    if (msg.type === 'tool-result') { say(msg.message, 'ok'); }
    if (msg.type === 'error') {
      if (bridgePending) {
        var abort = {type: 'export-abort', message: msg.message};
        if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(abort));
        else shipHttp(abort);
      }
      bridgePending = false; exporting = aepBusy = aepMode = false; aepPacket = imgAsm = null; updateButton(); say(msg.message, 'err', msg.nodeId);
    }
    if (msg.type === 'progress') { say(msg.message); }
    if (msg.type === 'images-done') {
      if (aepMode) { finishAep(); return; }
      bridgePending = false;
      var done = { type: 'images-complete' };
      if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(done));
      else shipHttp(done);
      return;
    }
    if (msg.type === 'image-chunk') {
      // reassemble ~1MB base64 string chunks (strings cross the sandbox cheaply)
      if (msg.seq === 0) { imgAsm = { meta: msg.meta, parts: [] }; }
      if (!imgAsm) return;
      imgAsm.parts.push(msg.dataPart);
      say('正在接收图片 ' + (msg.index + 1) + '/' + msg.total + '（分片 ' + (msg.seq + 1) + '/' + msg.parts + '）…');
      if (msg.seq === msg.parts - 1) {
        var img = imgAsm.meta; img.data = imgAsm.parts.join(''); imgAsm = null;
        if (aepMode) { if (aepPacket) aepPacket.images.push(img); return; }
        var ip = { type: 'image', index: msg.index, total: msg.total, image: img };
        if (connected && ws && ws.readyState === 1) { ws.send(JSON.stringify(ip)); say('正在将图片 ' + (msg.index + 1) + '/' + msg.total + ' 发送到 AE…'); }
        else { shipHttp(ip); }
      }
      return;
    }
    if (msg.type === 'ship') {
      bridgePending = !aepMode && msg.imageCount > 0;
      blendNotice = msg.blendStats && msg.blendStats.external ? ' 部分叠加依赖选区外的底图，请选择更外层画框。' : '';
      if (!msg.svg || msg.svg.indexOf('<svg') === -1) { exporting = aepMode = aepBusy = false; updateButton(); say('没有可发送的内容——Figma 导出的 SVG 为空。', 'err'); return; }
      if (aepMode) {
        aepPacket = {name: msg.name, frame: msg.frame, svg: msg.svg, nodes: msg.nodes, texts: msg.texts,
          effects: msg.effects, shift: msg.shift, containers: msg.containers, organize: msg.organize,
          imageCount: msg.imageCount || 0, images: []};
        if (!aepPacket.imageCount) finishAep();
        return;
      }
      var payload = { type: 'svg', name: msg.name, svg: msg.svg, texts: msg.texts || [], effects: msg.effects || [], shift: msg.shift || { x: 0, y: 0 }, nodes: msg.nodes || null,
                      containers: msg.containers || null, organize: !!msg.organize, imageCount: msg.imageCount || 0, imageBatch: !!msg.imageBatch, vnStats: msg.vnStats || null };
      var kb = Math.round((msg.bytes || msg.svg.length) / 1024);
      if (connected && ws && ws.readyState === 1) { ws.send(JSON.stringify(payload)); say('正在向 AE 发送 ' + kb + ' KB 数据…'); }
      else { shipHttp(payload); }
    }
  };

  connect();
</script>
