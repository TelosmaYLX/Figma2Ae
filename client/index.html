<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F2A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Connection and activity take priority. Keep the update action secondary in the header.
       Available updates use an inline disclosure with the status bar's surface, text and spacing. -->
  <header class="mk-header">
    <div class="mk-brand">
      <h1 class="mk-name">F2A</h1>
      <span class="mk-ver" id="mk-version"></span>
    </div>
    <button type="button" id="mk-update" class="mk-update" hidden>检查更新</button>
  </header>

  <details id="mk-update-notice" class="mk-figbar mk-update-notice" hidden>
    <summary>
      <span id="mk-update-title" class="mk-update-title" role="status"></span>
    </summary>
    <div id="mk-update-notes" class="mk-update-notes" role="region" aria-label="更新内容" tabindex="0"></div>
  </details>

  <!-- Primary workspace switcher: OpenPencil panel or Motion Library -->
  <div class="f2o-nav" role="tablist" aria-label="面板工作区">
    <div class="f2o-nav-tab f2o-nav-tab-op" id="f2o-tab-openpencil" role="tab" tabindex="0" aria-selected="false">
      <span class="f2o-tab-main">
        <span class="f2o-dot" id="f2o-dot" aria-hidden="true"></span>
        <span>OpenPencil</span>
      </span>
      <button type="button" class="f2o-popout-ico" id="f2o-popout" title="弹出独立的置顶 OpenPencil 小窗" aria-label="弹出独立的置顶 OpenPencil 小窗">
        <svg class="f2o-svg-ico" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5M12.5 9.2v3.3a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <button type="button" class="f2o-nav-tab active" id="f2o-tab-motion" role="tab" aria-selected="true">动效库</button>
  </div>

  <!-- Visual Motion Library workspace (managed by motionPanel.js) -->
  <section class="f2m-shell" aria-label="动画库">
    <div class="f2m-ctx">
      <div class="f2m-ctx-left">
        <span class="f2m-ctx-title">动效库</span>
      </div>
      <div class="f2m-ctx-acts">
        <button type="button" class="f2m-mini-act is-icon" id="f2m-act-collapse" title="折叠动效库" aria-label="折叠动效库" aria-expanded="true">
          <svg class="f2m-svg-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="f2m-tabs" role="tablist" aria-label="动效来源">
      <button type="button" class="f2m-tab active" data-tab="builtin" role="tab">内置动效</button>
      <button type="button" class="f2m-tab" data-tab="templates" role="tab">本地模板</button>
      <button type="button" class="f2m-tab" data-tab="user" role="tab">我的动效</button>
    </div>

    <div class="f2m-toolbar">
      <input type="search" class="f2m-search" id="f2m-search" placeholder="搜索动效、标签或模板…" aria-label="搜索动效">
      <button type="button" class="f2m-icon-act" id="f2m-params-toggle" title="展开/收起动效参数设置">
        <svg class="f2m-svg-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="5.5" cy="4.5" r="1.4" fill="currentColor"/><circle cx="10.5" cy="8" r="1.4" fill="currentColor"/><circle cx="6.5" cy="11.5" r="1.4" fill="currentColor"/></svg>
        <span>参数</span>
      </button>
      <button type="button" class="f2m-icon-act is-square" id="f2m-play-toggle" title="开启或暂停可视卡片循环预览" aria-label="切换自动预览"></button>
    </div>

    <div class="f2m-params" id="f2m-params" hidden>
      <label class="f2m-field">
        <span>倍速</span>
        <select id="f2m-p-speed">
          <option value="0.5">0.5x 慢速</option>
          <option value="0.75">0.75x 较慢</option>
          <option value="1" selected>1x 标准</option>
          <option value="1.25">1.25x 较快</option>
          <option value="1.5">1.5x 快速</option>
          <option value="2">2x 极速</option>
        </select>
      </label>
      <label class="f2m-field">
        <span>方向</span>
        <select id="f2m-p-dir">
          <option value="up" selected>向上</option>
          <option value="down">向下</option>
          <option value="left">向左</option>
          <option value="right">向右</option>
        </select>
      </label>
      <label class="f2m-field">
        <span>曲线</span>
        <select id="f2m-p-style">
          <option value="snappy" selected>利落 Snappy</option>
          <option value="smooth">柔和 Smooth</option>
          <option value="spring">弹簧 Spring</option>
          <option value="bounce">回弹 Bounce</option>
          <option value="linear">线性 Linear</option>
        </select>
      </label>
      <label class="f2m-field">
        <span>锚点</span>
        <select id="f2m-p-anchor">
          <option value="auto" selected>自动</option>
          <option value="end">保持落点</option>
          <option value="start">保持起点</option>
        </select>
      </label>
      <label class="f2m-check">
        <input type="checkbox" id="f2m-p-replace" checked>
        <span>覆盖已有关键帧</span>
      </label>
    </div>

    <div class="f2m-subbar" id="f2m-subbar" hidden></div>
    <div class="f2m-cats" id="f2m-cats"></div>
    <div class="f2m-scroll"><div class="f2m-grid" id="f2m-grid"></div></div>
  </section>

  <!-- Embedded OpenPencil panel workspace (managed by openpencilPanel.js) -->
  <section class="f2o-shell" id="f2o-shell" aria-label="OpenPencil 面板" hidden>
    <div class="f2o-notice" id="f2o-notice" hidden>
      <span class="f2o-notice-text" id="f2o-notice-text"></span>
      <button type="button" class="f2o-retry" id="f2o-retry">重试</button>
    </div>
    <iframe id="f2o-frame" class="f2o-frame" title="F2A OpenPencil 面板"></iframe>
  </section>

  <!-- Live log: every bridge, MCP and import message lands here with a timestamp.
       Its top grip drags the console taller or shorter; double-click restores the default. -->
  <section class="mk-console" aria-label="运行日志">
    <div class="mk-console-resize" id="mk-log-resize" role="separator" aria-orientation="horizontal" aria-label="调整日志高度" tabindex="0" title="拖动调整日志高度，双击恢复默认"></div>
    <div class="mk-console-head">
      <span>运行日志</span>
      <div class="f2m-console-acts">
        <button type="button" class="mk-console-clear" id="f2m-log-toggle" title="折叠或展开日志">收起</button>
        <button type="button" class="mk-console-clear" id="mk-log-clear" title="清空日志" aria-label="清空日志">清空</button>
      </div>
    </div>
    <div class="mk-console-list" id="mk-log" role="log" aria-live="polite"></div>
  </section>

  <!-- main.js first: it owns the live log, so the bridge modules can report from their first line. -->
  <script src="main.js"></script>
  <script src="figmaBridge.js"></script>
  <script src="mcpBridge.js"></script>
  <script src="updatePanel.js"></script>
  <script src="motionPreview.js"></script>
  <script src="motionPanel.js"></script>
  <script src="openpencilPanel.js"></script>
</body>
</html>
