<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F2A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Import stays primary. The image folder is a secondary shared setting: full, selectable,
       wrapping path plus a 36px folder button. Reuse existing surfaces, text, radius and 8px gaps. -->
  <header class="mk-header">
    <div class="mk-brand">
      <span class="mk-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M4 17 10 7l4 7 6-10"/>
        </svg>
      </span>
      <h1 class="mk-name">F2A</h1>
      <span class="mk-ver">v1.0</span>
    </div>
  </header>

  <main id="mk-main" class="mk-main"><!-- groups injected by main.js --></main>

  <div class="mk-status" id="mk-status" aria-live="polite"></div>

  <!-- Figma bridge status (updated by figmaBridge.js) -->
  <div class="mk-figbar" id="mk-figbar">
    <span class="mk-fig-dot off" id="mk-fig-dot" aria-hidden="true"></span>
    <span class="mk-fig-label" id="mk-fig-label">正在启动 SVG 桥接…</span>
  </div>

  <div class="mk-image-folder">
    <div class="mk-image-folder-label" id="mk-image-folder-label">图片保存位置</div>
    <div class="mk-image-folder-row">
      <div class="mk-image-folder-path" id="mk-image-folder-path" role="status" aria-labelledby="mk-image-folder-label">未选择</div>
      <button type="button" class="mk-image-folder-choose" id="mk-image-folder-choose" title="选择图片保存位置" aria-label="选择图片保存位置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      </button>
    </div>
  </div>

  <div class="mk-foot">
    <a href="#" id="mk-feedback" class="mk-foot-link">发送反馈</a>
    <span class="mk-foot-ver" id="mk-foot-ver">v1.0</span>
  </div>

  <!-- Popup -->
  <div class="mk-overlay" id="mk-overlay" hidden>
    <div class="mk-popup" role="dialog" aria-modal="true" aria-labelledby="mk-popup-title">
      <div class="mk-popup-head">
        <h2 id="mk-popup-title">标题</h2>
        <button class="mk-close" id="mk-popup-close" aria-label="关闭">&times;</button>
      </div>
      <div class="mk-popup-body" id="mk-popup-body"></div>
    </div>
  </div>

  <script src="figmaBridge.js"></script>
  <script src="main.js"></script>
</body>
</html>
